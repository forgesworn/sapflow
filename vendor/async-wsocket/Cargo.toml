[package]
edition = "2021"
name = "async-wsocket"
version = "0.17.0"
authors = ["Yuki Kishimoto <yukikishimoto@protonmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A convenience library for using websockets both in native and WASM environments!"
homepage = "https://github.com/yukibtc/async-wsocket"
readme = "README.md"
keywords = [
    "async",
    "tokio",
    "wasm",
    "websocket",
]
categories = [
    "asynchronous",
    "network-programming",
    "api-bindings",
    "wasm",
    "web-programming::websocket",
]
license = "MIT"
repository = "https://github.com/yukibtc/async-wsocket.git"

[features]
aws_lc_rs = [
    "dep:tokio-rustls",
    "tokio-rustls/aws_lc_rs",
]
default = [
    "ring",
    "rustls-tls-webpki-roots",
]
native-tls = ["tokio-tungstenite/native-tls"]
native-tls-vendored = ["tokio-tungstenite/native-tls-vendored"]
ring = [
    "dep:tokio-rustls",
    "tokio-rustls/ring",
]
rustls-tls-native-roots = ["tokio-tungstenite/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["tokio-tungstenite/rustls-tls-webpki-roots"]
socks = ["dep:tokio-socks"]

[lib]
name = "async_wsocket"
path = "src/lib.rs"

[[example]]
name = "client"
path = "examples/client.rs"

[dependencies.futures-util]
version = "0.3"
features = [
    "std",
    "sink",
]
default-features = false

[dependencies.url]
version = "2.5"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = ["net"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-happy-eyeballs]
version = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-rustls]
version = "0.26"
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-socks]
version = "0.5"
optional = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio-tungstenite]
version = "0.28"
features = [
    "handshake",
    "stream",
]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies.tokio]
version = "1"
features = [
    "macros",
    "rt-multi-thread",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.futures]
version = "0.3"
features = ["std"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "CloseEvent",
    "MessageEvent",
    "DomException",
    "WebSocket",
]
