[package]
edition = "2024"
rust-version = "1.85.0"
name = "nostr-connect"
version = "0.45.2"
authors = [
    "Yuki Kishimoto <yukikishimoto@protonmail.com>",
    "Nostr Dev Kit Developers",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Nostr Remote Signing (NIP46)"
homepage = "https://nostrdevkit.org"
readme = "README.md"
keywords = [
    "nostr",
    "signer",
    "nip46",
    "nostr-connect",
]
license = "MIT"
repository = "https://github.com/nostrdevkit/nostr.git"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
aws_lc_rs = ["nostr-sdk/aws_lc_rs"]
