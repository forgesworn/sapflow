[workspace]
resolver = "3"
members = [
    "crates/sapflow-core",
    "crates/sapflow-hls",
    "crates/sapflow-srt",
    "crates/sapflow-server",
    "crates/sapflow-bench",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "MIT"
repository = "https://github.com/forgesworn/sapflow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

# Smaller builds on a nearly full disk: line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Unwind, not abort: a panic on hostile input then ends only the task it
# happened in (one connection), not the server.
panic = "unwind"

# Release code with symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
