[package]
name = "sapflow-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

[dependencies]
libfuzzer-sys = "0.4.13"
httparse = "1.10.1"
bytes = "1.12.1"
sapflow-core = { path = "../crates/sapflow-core" }
sapflow-hls = { path = "../crates/sapflow-hls" }
sapflow-rtmp = { path = "../crates/sapflow-rtmp" }
sapflow-srt = { path = "../crates/sapflow-srt" }
sapflow-rtp = { path = "../crates/sapflow-rtp", features = ["testing"] }
sapflow-dtls = { path = "../crates/sapflow-dtls", features = ["testing"] }
sapflow-whip = { path = "../crates/sapflow-whip", features = ["testing"] }
sapflow-client = { path = "../crates/sapflow-client" }
sapflow-signet-ffi = { path = "../crates/sapflow-signet-ffi" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std", "process"] }

[[bin]]
name = "ts_ingest"
path = "fuzz_targets/ts_ingest.rs"
test = false
doc = false
bench = false

