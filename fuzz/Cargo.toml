[package]
name = "sapflow-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

[dependencies]
libfuzzer-sys = "0.4.13"
httparse = "1.10.1"
bytes = "1.12.1"
sapflow-core = { path = "../crates/sapflow-core" }
sapflow-hls = { path = "../crates/sapflow-hls" }
sapflow-rtmp = { path = "../crates/sapflow-rtmp" }
sapflow-srt = { path = "../crates/sapflow-srt" }
sapflow-client = { path = "../crates/sapflow-client" }
sapflow-signet-ffi = { path = "../crates/sapflow-signet-ffi" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std", "process"] }

[[bin]]
name = "ts_ingest"
path = "fuzz_targets/ts_ingest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flv_ingest"
path = "fuzz_targets/flv_ingest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "small_parsers"
path = "fuzz_targets/small_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_session"
path = "fuzz_targets/rtmp_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "amf0"
path = "fuzz_targets/amf0.rs"
test = false
doc = false
bench = false

[[bin]]
name = "own_srt_packet"
path = "fuzz_targets/own_srt_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "own_srt_listener"
path = "fuzz_targets/own_srt_listener.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "muxer_timing"
path = "fuzz_targets/muxer_timing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "own_srt_caller"
path = "fuzz_targets/own_srt_caller.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rtmp_client"
path = "fuzz_targets/rtmp_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mobile_media"
path = "fuzz_targets/mobile_media.rs"
test = false
doc = false
bench = false

[[bin]]
name = "publish_session"
path = "fuzz_targets/publish_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signet_auth"
path = "fuzz_targets/signet_auth.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http1_request"
path = "fuzz_targets/http1_request.rs"
test = false
doc = false
bench = false

[patch.crates-io]
nostr-connect = { path = "../vendor/nostr-connect" }
nostr-sdk = { path = "../vendor/nostr-sdk" }
async-wsocket = { path = "../vendor/async-wsocket" }

