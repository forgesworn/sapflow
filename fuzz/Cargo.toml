[package]
name = "sapflow-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
bytes = "1.12.1"
sapflow-core = { path = "../crates/sapflow-core" }
sapflow-hls = { path = "../crates/sapflow-hls" }
sapflow-srt = { path = "../crates/sapflow-srt" }

[[bin]]
name = "ts_ingest"
path = "fuzz_targets/ts_ingest.rs"
test = false
doc = false
bench = false

