name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  realtime-wasm:
    name: Opaque real-time browser scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and browser target
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "true"
      - name: Install matching safe browser bindings
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.129" ]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
          fi
      - name: Build and test the actual compiled WASM boundary
        run: |
          scripts/build-realtime-wasm.sh
          node --test tests/realtime-wasm.test.mjs
      - name: Retain the qualified scheduler and licence notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: realtime-browser-scheduler
          path: target/realtime-browser/
          if-no-files-found: error
          retention-days: 14

  ios-checkpoint-sdk:
    name: iOS SDK checkpoint tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build host SDK and run checkpoint tests
        run: python3 -B mobile/ios/test-recording-checkpoints-sdk.py
      - name: Prepare native recording readback tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Check the generated SDK and legacy recording matrix
        run: bash mobile/ios/check-capture-recording.sh
      - name: Prepare the existing lock-pinned Swift fuzz runtime
        # The workspace config shares target/; build only the existing runtime.
        run: cargo build --locked --manifest-path fuzz/Cargo.toml -p libfuzzer-sys -j1
      - name: Replay and fuzz canonical recovery receipts with ASan
        env:
          SAPFLOW_RECOVERY_RECEIPT_FUZZ_SECONDS: "20"
        run: bash mobile/ios/fuzz-recording-recovery-receipt.sh
      - name: Retain synthetic recovery receipt fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-recovery-receipt-fuzz
          path: target/ios-recovery-receipt-fuzz
          if-no-files-found: ignore
      - name: Retain generated native recording checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-recording
          path: target/ios-native-recording
          if-no-files-found: ignore

  android-sdk-app:
    name: Android current SDK and app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install --profile minimal
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-sdk-app-arm64-v1
      - name: Select JDK 21 and the Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          printf '%s\n' "JAVA_HOME=$JAVA_HOME" "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sapflow_sdkmanager="${ANDROID_HOME:?Android SDK is required}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sapflow_sdkmanager"
          "$sapflow_sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0" "ndk;27.1.12297006"
      - name: Prepare the checksum-pinned Kotlin 2.2 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-tooling
          sapflow_kotlin="$(mktemp -d "$GITHUB_WORKSPACE/target/native-tooling/kotlin-2.2.20-XXXXXX")"
          curl --fail --location --retry 3 --output "$sapflow_kotlin/compiler.zip" https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          printf '%s  %s\n' 81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420 "$sapflow_kotlin/compiler.zip" | sha256sum --check
          unzip -q "$sapflow_kotlin/compiler.zip" -d "$sapflow_kotlin"
          rm "$sapflow_kotlin/compiler.zip"
          printf '%s\n' "KOTLIN_HOME=$sapflow_kotlin/kotlinc" >> "$GITHUB_ENV"
          printf '%s\n' "$sapflow_kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build the fresh ARM64 SDK and check the app
        run: python3 -B mobile/android/check-sdk-app.py
      - name: Retain scalar Android SDK and app evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-current-sdk-app
          path: target/android-sdk-app
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: Format, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The A3.10 test-only feedback hooks are behind a feature no other
      # build turns on, so lint that build too, or it would rot unseen.
      - name: Clippy, test-feedback build
        run: cargo clippy -p sapflow --all-targets --features test-feedback -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Android build gate regressions
        run: python3 -B tests/test_android_sdk_app.py
      - name: Performance receipt regressions
        run: |
          python3 -B tests/test_performance.py
          python3 -B tests/test_measure_process.py
          python3 -B tests/test_http_efficiency.py
          python3 -B tests/test_qualify_srt_gap.py
          python3 -B tests/test_srt_loss_results.py
          python3 -B tests/test_smoke_media.py
      - name: Native package output regressions
        run: node --test scripts/native-build-options.test.mjs
      - name: Native authentication source and packaging regressions
        run: |
          node --check scripts/build-signet-native.mjs
          python3 -B scripts/verify-signet-sources.py
          python3 -B tests/test_signet_source_verifier.py
          python3 -B tests/test_signet_packaging_receipt.py
      - name: iOS privacy resource regressions (generated bundles)
        run: |
          python3 -B tests/test_ios_privacy_resources.py
          python3 -B tests/test_ios_xctest_runtime.py
          python3 -B tests/test_ios_capture_recording.py
          python3 -B tests/test_ios_simulator_report.py

  fuzz:
    name: Fuzz regressions and 60 s per target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          cache-bin: "true"
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Replay regressions, then fuzz each target
        working-directory: fuzz
        env:
          # The pinned toolchain is stable; fuzzing needs nightly features.
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            reg="regressions/$target"
            mkdir -p "$scratch/$target"
            if [ -d "$reg" ] && [ -n "$(ls -A "$reg")" ]; then
              # Files as arguments: each runs once and nothing is written back.
              cargo fuzz run -O -a "$target" "$reg"/*
              cp "$reg"/* "$scratch/$target/"
            fi
            if [ -d "seeds/$target" ]; then
              for seed in "seeds/$target"/*; do
                if [ -f "$seed" ]; then cp "$seed" "$scratch/$target/"; fi
              done
            fi
            cargo fuzz run -O -a "$target" "$scratch/$target" -- -max_total_time=60 -max_len=65536
            echo "::endgroup::"
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  smoke:
    name: Smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ffmpeg and SRT tools
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          # The runner could not resolve three ubuntu.com archive hosts.
          # Include kernel.org's Ubuntu mirror in a separate DNS zone, retaining
          # Ubuntu signatures and bounded downloads. Never retry a dpkg run.
          . /etc/os-release
          test "$ID:$VERSION_CODENAME" = ubuntu:noble
          test "$(dpkg --print-architecture)" = amd64
          sapflow_apt="$(mktemp -d "$RUNNER_TEMP/sapflow-apt-XXXXXX")"
          trap 'sudo rm -rf "$sapflow_apt"' EXIT
          chmod 0755 "$sapflow_apt"
          mkdir "$sapflow_apt/parts" "$sapflow_apt/archives"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sapflow_apt/ubuntu.list"
            -o "Dir::Etc::sourceparts=$sapflow_apt/parts"
            -o "Dir::Cache::archives=$sapflow_apt/archives"
            -o Acquire::Retries=0
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
            -o Acquire::Languages=none
            -o APT::Update::Error-Mode=any
          )
          packages=(ffmpeg srt-tools curl python3 openssh-server netcat-openbsd)
          downloaded=false
          for mirror in https://mirrors.edge.kernel.org/ubuntu https://archive.ubuntu.com/ubuntu https://security.ubuntu.com/ubuntu; do
            printf 'Trying authenticated Ubuntu packages from %s\n' "$mirror"
            for suite in noble noble-updates noble-backports noble-security; do
              printf 'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main restricted universe multiverse\n' "$mirror" "$suite"
            done > "$sapflow_apt/ubuntu.list"
            # An unsuccessful refresh must not reuse an earlier mirror's lists.
            lists="$(mktemp -d "$sapflow_apt/lists-XXXXXX")"
            chmod 0755 "$lists"
            if sudo timeout --kill-after=5s 60s apt-get "${apt_options[@]}" -o "Dir::State::lists=$lists" update &&
               sudo timeout --kill-after=5s 120s apt-get "${apt_options[@]}" -o "Dir::State::lists=$lists" install --download-only -y --no-install-recommends "${packages[@]}"; then
              downloaded=true
              break
            fi
            printf 'Ubuntu endpoint failed or exceeded its download budget: %s\n' "$mirror" >&2
          done
          if [ "$downloaded" != true ]; then
            echo 'No Ubuntu mirror completed authenticated package downloads' >&2
            exit 1
          fi
          # All downloads passed APT signature/hash checks. Install once, offline;
          # only the outer step timeout bounds dpkg, never a mirror retry loop.
          sudo apt-get "${apt_options[@]}" -o "Dir::State::lists=$lists" install --no-download -y --no-install-recommends "${packages[@]}"
          sudo install -d -m 0755 /run/sshd
          command -v srt-live-transmit ffmpeg ffprobe
      - name: Install FFmpeg with the WHIP muxer
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          # Ubuntu's ffmpeg (6.1) has no WHIP muxer, which FFmpeg 8 added. The
          # smoke's WHIP publisher is a pinned static build, checked by its
          # SHA-256: a month-end autobuild of FFmpeg-Builds (n8.1.3 linux64
          # gpl, with OpenSSL, libx264 and libopus); that project keeps its
          # month-end builds for two years, its daily ones for about two
          # weeks. Ubuntu's ffmpeg does the rest.
          url=https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-gpl-8.1.tar.xz
          sha256=41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380
          dir="$(mktemp -d "$RUNNER_TEMP/ffmpeg-whip-XXXXXX")"
          curl -fsSL --proto '=https' --retry 3 --retry-all-errors --connect-timeout 10 --max-time 240 -o "$dir/ffmpeg.tar.xz" "$url"
          echo "$sha256  $dir/ffmpeg.tar.xz" | sha256sum -c -
          tar -xJf "$dir/ffmpeg.tar.xz" -C "$dir" --strip-components=1
          "$dir/bin/ffmpeg" -hide_banner -version | sed -n 1p
          "$dir/bin/ffmpeg" -hide_banner -muxers | grep -E '^ *E +whip '
          echo "SMOKE_WHIP_FFMPEG=$dir/bin/ffmpeg" >> "$GITHUB_ENV"
      - name: Smoke, viewers on the own event loop
        env:
          SAPFLOW_HTTP_IMPL: own
          SAPFLOW_HTTP_THREADS: 1
        run: scripts/smoke.sh
      - name: Prepared TV script regressions (generated media only)
        run: |
          bash -n scripts/tv-prepare.sh scripts/tv-playout.sh
          python3 -B tests/test_tv_scripts.py
          python3 -B tests/test_private_tv_publish.py
          python3 -B tests/test_tv_channel_control.py
          # Only the generated loopback sshd fixture needs Linux PAM privileges.
          # Do not unlock the runner's password account to enable key auth.
          sudo -n python3 -B tests/test_private_tv_integration.py
      - name: TV player, preview privacy and bounded manifest mutation gate
        run: |
          npm ci --prefix tools/tv-relayswarm --ignore-scripts --no-audit --no-fund
          python3 tools/tv-relayswarm/fetch.py
          python3 tools/tv-relayswarm/wasm-notices.py --check
          node tools/tv-relayswarm/build.mjs
          git diff --exit-code -- web/tv/vendor/THIRD-PARTY-LICENCES.txt
          node --test tests/tv-audience.test.mjs tests/tv-player.test.mjs tests/tv-playlist.test.mjs tests/tv-tone.test.mjs tests/tv-connection.test.mjs tests/tv-peers.test.mjs tests/tv-swarm-server.test.mjs
          node fuzz/tv_playlist_fuzz.mjs 20000
          node fuzz/tv_swarm_fuzz.mjs 20000
          python3 -B scripts/check-tv-assets.py
          python3 -m venv "$RUNNER_TEMP/tv-preview-venv"
          "$RUNNER_TEMP/tv-preview-venv/bin/python" -m pip install --only-binary=:all: --require-hashes --no-deps -r scripts/requirements-tv-preview.txt
          "$RUNNER_TEMP/tv-preview-venv/bin/python" -B tests/test_tv_preview.py
          python3 -B fuzz/tv_preview_fuzz.py 20000
      - name: Real generated-video and audio playback through Sapflow
        run: |
          set -euo pipefail
          tv_tools=$(mktemp -d)
          trap 'rm -rf "$tv_tools"' EXIT
          npm install --prefix "$tv_tools" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.63.0
          export SAPFLOW_PLAYWRIGHT_MODULE="$tv_tools/node_modules/playwright/index.mjs"
          SAPFLOW_TV_TEST_PEERS=1 python3 -B tests/tv_browser_fixture.py
      - name: Retain generated TV browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tv-browser-generated
          path: target/tv-browser/
          if-no-files-found: ignore
          retention-days: 14
