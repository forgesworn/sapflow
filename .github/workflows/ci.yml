name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  realtime-wasm:
    name: Opaque real-time browser scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain and browser target
        run: |
          rustup toolchain install --profile minimal
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: "true"
      - name: Install matching safe browser bindings
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null || true)" != "wasm-bindgen 0.2.129" ]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
          fi
      - name: Build and test the actual compiled WASM boundary
        run: |
          scripts/build-realtime-wasm.sh
          node --test tests/realtime-wasm.test.mjs
      - name: Retain the qualified scheduler and licence notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: realtime-browser-scheduler
          path: target/realtime-browser/
          if-no-files-found: error
          retention-days: 14

  ios-checkpoint-sdk:
    name: iOS SDK checkpoint tests
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build host SDK and run checkpoint tests
        run: python3 -B mobile/ios/test-recording-checkpoints-sdk.py
      - name: Prepare native recording readback tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Check the generated SDK and legacy recording matrix
        run: bash mobile/ios/check-capture-recording.sh
      - name: Prepare the existing lock-pinned Swift fuzz runtime
        # The workspace config shares target/; build only the existing runtime.
        run: cargo build --locked --manifest-path fuzz/Cargo.toml -p libfuzzer-sys -j1
      - name: Replay and fuzz canonical recovery receipts with ASan
        env:
          SAPFLOW_RECOVERY_RECEIPT_FUZZ_SECONDS: "20"
        run: bash mobile/ios/fuzz-recording-recovery-receipt.sh
      - name: Retain synthetic recovery receipt fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-recovery-receipt-fuzz
          path: target/ios-recovery-receipt-fuzz
          if-no-files-found: ignore
      - name: Retain generated native recording checks
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-native-recording
          path: target/ios-native-recording
          if-no-files-found: ignore

  android-sdk-app:
    name: Android current SDK and app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install --profile minimal
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-sdk-app-arm64-v1
      - name: Select JDK 21 and the Android build tools
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?JDK 21 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          printf '%s\n' "JAVA_HOME=$JAVA_HOME" "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sapflow_sdkmanager="${ANDROID_HOME:?Android SDK is required}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sapflow_sdkmanager"
          "$sapflow_sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0" "ndk;27.1.12297006"
      - name: Prepare the checksum-pinned Kotlin 2.2 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/native-tooling
          sapflow_kotlin="$(mktemp -d "$GITHUB_WORKSPACE/target/native-tooling/kotlin-2.2.20-XXXXXX")"
          curl --fail --location --retry 3 --output "$sapflow_kotlin/compiler.zip" https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          printf '%s  %s\n' 81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420 "$sapflow_kotlin/compiler.zip" | sha256sum --check
          unzip -q "$sapflow_kotlin/compiler.zip" -d "$sapflow_kotlin"
          rm "$sapflow_kotlin/compiler.zip"
          printf '%s\n' "KOTLIN_HOME=$sapflow_kotlin/kotlinc" >> "$GITHUB_ENV"
          printf '%s\n' "$sapflow_kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Build the fresh ARM64 SDK and check the app
        run: python3 -B mobile/android/check-sdk-app.py
      - name: Retain scalar Android SDK and app evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-current-sdk-app
          path: target/android-sdk-app
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: Format, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Android build gate regressions
        run: python3 -B tests/test_android_sdk_app.py
      - name: Performance receipt regressions
        run: |
          python3 -B tests/test_performance.py
          python3 -B tests/test_measure_process.py
          python3 -B tests/test_srt_loss_results.py
          python3 -B tests/test_smoke_media.py
      - name: Native package output regressions
        run: node --test scripts/native-build-options.test.mjs
      - name: Native authentication source and packaging regressions
        run: |
          node --check scripts/build-signet-native.mjs
          python3 -B scripts/verify-signet-sources.py
          python3 -B tests/test_signet_source_verifier.py
          python3 -B tests/test_signet_packaging_receipt.py
      - name: iOS privacy resource regressions (generated bundles)
        run: |
          python3 -B tests/test_ios_privacy_resources.py
          python3 -B tests/test_ios_xctest_runtime.py
          python3 -B tests/test_ios_capture_recording.py

  fuzz:
    name: Fuzz regressions and 60 s per target
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          cache-bin: "true"
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Replay regressions, then fuzz each target
        working-directory: fuzz
        env:
          # The pinned toolchain is stable; fuzzing needs nightly features.
          RUSTC_BOOTSTRAP: "1"
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          for target in $(cargo fuzz list); do
            echo "::group::$target"
            reg="regressions/$target"
            mkdir -p "$scratch/$target"
            if [ -d "$reg" ] && [ -n "$(ls -A "$reg")" ]; then
              # Files as arguments: each runs once and nothing is written back.
              cargo fuzz run -O -a "$target" "$reg"/*
              cp "$reg"/* "$scratch/$target/"
            fi
            if [ -d "seeds/$target" ]; then
              for seed in "seeds/$target"/*; do
                if [ -f "$seed" ]; then cp "$seed" "$scratch/$target/"; fi
              done
            fi
            cargo fuzz run -O -a "$target" "$scratch/$target" -- -max_total_time=60 -max_len=65536
            echo "::endgroup::"
          done
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ffmpeg and SRT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg srt-tools curl python3 openssh-server netcat-openbsd
          sudo install -d -m 0755 /run/sshd
          command -v srt-live-transmit ffmpeg ffprobe
      - name: Smoke, viewers on the own event loop
        env:
          SAPFLOW_HTTP_IMPL: own
          SAPFLOW_HTTP_THREADS: 1
        run: scripts/smoke.sh
      - name: Prepared TV script regressions (generated media only)
        run: |
          bash -n scripts/tv-prepare.sh scripts/tv-playout.sh
          python3 -B tests/test_tv_scripts.py
          python3 -B tests/test_private_tv_publish.py
          python3 -B tests/test_private_tv_integration.py
