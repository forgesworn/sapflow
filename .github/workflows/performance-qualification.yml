name: Performance qualification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact ancestor commit to compare against (40 hexadecimal characters)
        required: true
        default: aee2a526c26f8837266857e139b46d40591d5da2
        type: string

permissions:
  contents: read

concurrency:
  group: performance-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  QUALIFICATION_BASELINE: ${{ inputs.baseline || 'aee2a526c26f8837266857e139b46d40591d5da2' }}

jobs:
  http:
    name: Paired HTTP qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned compiler and generated-media tools
        run: |
          rustup toolchain install --profile minimal
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
      - name: Verify the measurement harness
        run: |
          python3 -B tests/test_http_efficiency.py
          python3 -B tests/test_performance.py
          python3 -B tests/test_measure_process.py
      - name: Build the exact parent and candidate sequentially
        run: bash scripts/build-http-comparison.sh "$QUALIFICATION_BASELINE" "$GITHUB_SHA"
      - name: Run the frozen paired HTTP campaign
        run: |
          ulimit -n 8192
          python3 -B scripts/compare-http-efficiency.py --qualify-linux \
            --baseline target/performance-qualification/baseline-sapflow \
            --candidate target/release/sapflow --bench target/release/sapflow-bench \
            --baseline-source "$QUALIFICATION_BASELINE" --candidate-source "$GITHUB_SHA" \
            --pairs 4 --seconds 60 --threads 2 \
            --output target/performance-qualification/http.json
      - name: Retain compact results, including failed guards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: http-performance-qualification
          path: target/performance-qualification/http.json
          if-no-files-found: warn
          retention-days: 7

  srt:
    name: Paired SRT receive-gap qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned compiler
        run: rustup toolchain install --profile minimal
      - name: Verify the measurement harness
        run: python3 -B tests/test_qualify_srt_gap.py
      - name: Build and run the frozen paired SRT campaign
        run: |
          python3 -B scripts/qualify-srt-gap.py \
            --baseline "$QUALIFICATION_BASELINE" --candidate "$GITHUB_SHA" \
            --output target/performance-qualification/srt.json
      - name: Retain compact results, including failed guards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: srt-performance-qualification
          path: target/performance-qualification/srt.json
          if-no-files-found: warn
          retention-days: 7

  pgo:
    name: Paired default and profile-guided server comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler with its profile tools, media tools and the SRT publisher
        run: |
          rustup toolchain install --profile minimal
          rustup component add llvm-tools
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg srt-tools
      - name: Verify the harness
        run: python3 -B tests/test_compare_srt_ingest.py
      - name: Build the default server, then the profile-guided one
        run: |
          mkdir -p target/performance-qualification
          cargo build --locked --release -p sapflow -j 2
          cp target/release/sapflow target/performance-qualification/default-sapflow
          bash scripts/build-pgo.sh target/performance-qualification/pgo-sapflow
      - name: Paired SRT ingest CPU (12 publishers, 6 Mbit/s each, no viewers)
        run: |
          python3 -B scripts/compare-srt-ingest.py \
            --baseline target/performance-qualification/default-sapflow \
            --candidate target/performance-qualification/pgo-sapflow \
            --publishers 12 --bitrate-kbit 6000 --seconds 30 --pairs 4 \
            --output target/performance-qualification/pgo-srt-ingest.json
      - name: Paired HTTP screening (one stream, 32 viewers; eight streams, 16 each)
        if: always()
        run: |
          python3 -B scripts/compare-http-efficiency.py \
            --baseline target/performance-qualification/default-sapflow \
            --candidate target/performance-qualification/pgo-sapflow \
            --bench target/release/sapflow-bench \
            --baseline-source "$GITHUB_SHA" --candidate-source "$GITHUB_SHA" \
            --pairs 4 --seconds 30 --threads 4 \
            --output target/performance-qualification/pgo-http.json
      - name: Retain compact results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pgo-comparison
          path: |
            target/performance-qualification/pgo-srt-ingest.json
            target/performance-qualification/pgo-http.json
          if-no-files-found: warn
          retention-days: 7

  image:
    name: The container image's profile-guided server against a plain build of it
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install media tools and the SRT publisher for the comparison
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg srt-tools
      - name: Build the image both ways and take the server out of each
        run: |
          mkdir -p target/performance-qualification
          docker build --build-arg PGO=0 -t sapflow:plain .
          docker build -t sapflow:pgo .
          for kind in plain pgo; do
            id=$(docker create "sapflow:$kind")
            docker cp "$id:/usr/local/bin/sapflow" "target/performance-qualification/$kind-sapflow"
            docker rm "$id" >/dev/null
          done
      - name: The profile-guided image starts and answers
        run: |
          docker run --rm sapflow:pgo --version
          docker run -d --name probe -e SAPFLOW_OPEN_PUBLISH=1 -p 127.0.0.1:18888:8888 sapflow:pgo
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18888/live/none/index.m3u8 || true)
            [ "$code" = 404 ] && break
            sleep 0.5
          done
          docker logs probe | tail -5
          docker rm -f probe >/dev/null
          [ "$code" = 404 ]
      - name: Paired SRT ingest CPU and peak RSS (12 publishers, 6 Mbit/s each, no viewers)
        run: |
          python3 -B scripts/compare-srt-ingest.py \
            --baseline target/performance-qualification/plain-sapflow \
            --candidate target/performance-qualification/pgo-sapflow \
            --publishers 12 --bitrate-kbit 6000 --seconds 30 --pairs 4 \
            --output target/performance-qualification/image-srt-ingest.json
      - name: Retain compact results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-comparison
          path: target/performance-qualification/image-srt-ingest.json
          if-no-files-found: warn
          retention-days: 7
