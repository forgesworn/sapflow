name: Performance qualification

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Exact ancestor commit to compare against (40 hexadecimal characters)
        required: true
        default: aee2a526c26f8837266857e139b46d40591d5da2
        type: string
      srt_benefit:
        description: SRT profile the change must improve; the others must not regress
        required: true
        default: bursty-stream
        type: choice
        options:
          - bursty-stream
          - fragmented-stream

permissions:
  contents: read

concurrency:
  group: performance-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
  QUALIFICATION_BASELINE: ${{ inputs.baseline || 'aee2a526c26f8837266857e139b46d40591d5da2' }}
  QUALIFICATION_SRT_BENEFIT: ${{ inputs.srt_benefit || 'bursty-stream' }}

jobs:
  http:
    name: Paired HTTP qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned compiler and generated-media tools
        run: |
          rustup toolchain install --profile minimal
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg
          fi
      - name: Verify the measurement harness
        run: |
          python3 -B tests/test_http_efficiency.py
          python3 -B tests/test_performance.py
          python3 -B tests/test_measure_process.py
      - name: Build the exact parent and candidate sequentially
        run: bash scripts/build-http-comparison.sh "$QUALIFICATION_BASELINE" "$GITHUB_SHA"
      - name: Run the frozen paired HTTP campaign
        run: |
          ulimit -n 8192
          python3 -B scripts/compare-http-efficiency.py --qualify-linux \
            --baseline target/performance-qualification/baseline-sapflow \
            --candidate target/release/sapflow --bench target/release/sapflow-bench \
            --baseline-source "$QUALIFICATION_BASELINE" --candidate-source "$GITHUB_SHA" \
            --pairs 4 --seconds 60 --threads 2 \
            --output target/performance-qualification/http.json
      - name: Retain compact results, including failed guards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: http-performance-qualification
          path: target/performance-qualification/http.json
          if-no-files-found: warn
          retention-days: 7

  srt:
    name: Paired SRT receive-gap qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned compiler
        run: rustup toolchain install --profile minimal
      - name: Verify the measurement harness
        run: python3 -B tests/test_qualify_srt_gap.py
      - name: Build and run the frozen paired SRT campaign
        run: |
          python3 -B scripts/qualify-srt-gap.py \
            --baseline "$QUALIFICATION_BASELINE" --candidate "$GITHUB_SHA" \
            --benefit "$QUALIFICATION_SRT_BENEFIT" \
            --output target/performance-qualification/srt.json
      - name: Retain compact results, including failed guards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: srt-performance-qualification
          path: target/performance-qualification/srt.json
          if-no-files-found: warn
          retention-days: 7

  library:
    name: Paired library benchmark qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # chunk-reassembly stays available to the script; its campaign was
        # rejected on 2026-11-24 and its runtime change removed.
        bench: [ts-ingest, ts-ingest-codec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned compiler
        run: rustup toolchain install --profile minimal
      - name: Verify the measurement harness
        run: python3 -B tests/test_qualify_library_bench.py
      - name: Build and run the paired campaign
        run: |
          python3 -B scripts/qualify-library-bench.py --bench "${{ matrix.bench }}" \
            --baseline "$QUALIFICATION_BASELINE" --candidate "$GITHUB_SHA" \
            --output "target/performance-qualification/${{ matrix.bench }}.json"
      - name: Retain compact results, including failed guards
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: library-${{ matrix.bench }}-qualification
          path: target/performance-qualification/${{ matrix.bench }}.json
          if-no-files-found: warn
          retention-days: 7

  rtp:
    name: RTP NACK query microbenchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the pinned compiler
        run: rustup toolchain install --profile minimal
      - name: Scan against kept NACK times, in one binary
        run: |
          for round in 1 2 3; do
            cargo test --locked --release -p sapflow-rtp --lib kept_nack_times_microbenchmark -j 2 \
              -- --ignored --nocapture | grep '"gaps"'
          done

  profile:
    name: Where SRT ingest CPU goes (perf, 12 publishers, no viewers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned compiler, media tools, the SRT publisher and perf
        run: |
          rustup toolchain install --profile minimal
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg srt-tools \
            linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          ls /usr/lib/linux-tools/*/perf
      - name: Build the server with symbols and frame pointers
        run: |
          RUSTFLAGS="-C force-frame-pointers=yes" cargo build --locked --profile profiling -p sapflow -j 2
      - name: Record the whole host while the ingest harness runs
        run: |
          perf=$(ls /usr/lib/linux-tools/*/perf | head -1)
          mkdir -p target/performance-qualification/profile
          out=target/performance-qualification/profile
          sudo "$perf" record -F 499 -a -g -o "$out/perf.data" &
          sleep 2
          python3 -B scripts/compare-srt-ingest.py \
            --baseline target/profiling/sapflow --candidate target/profiling/sapflow \
            --publishers 12 --bitrate-kbit 6000 --seconds 40 --pairs 1 \
            --output "$out/ingest.json"
          sudo pkill -INT -x perf || true
          sleep 5
          sudo chmod a+r "$out/perf.data"
          sudo "$perf" report -i "$out/perf.data" --comm tokio-rt-worker --percentage relative --no-children \
            --sort dso --stdio -g none 2>/dev/null | grep -v '^$' | head -60 > "$out/by-dso.txt"
          sudo "$perf" report -i "$out/perf.data" --comm tokio-rt-worker --percentage relative --no-children \
            --sort dso,symbol --stdio -g none 2>/dev/null | grep -v '^$' | head -700 > "$out/self-by-symbol.txt"
          sudo "$perf" report -i "$out/perf.data" --comm tokio-rt-worker --percentage relative --children \
            --sort symbol --stdio -g none 2>/dev/null | grep -v '^$' | head -700 > "$out/inclusive-by-symbol.txt"
          sudo "$perf" report -i "$out/perf.data" --no-children --sort comm --stdio -g none \
            2>/dev/null | grep -v '^$' | head -40 > "$out/by-process.txt"
          sudo "$perf" report -i "$out/perf.data" --comm tokio-rt-worker --percentage relative --no-children \
            --sort symbol --stdio -g caller,0.5,callee --percent-limit 0.8 2>/dev/null \
            | grep -v '^$' | head -2500 > "$out/callers-of-hot-symbols.txt"
          sudo "$perf" script -i "$out/perf.data" --comms tokio-rt-worker -F ip,sym 2>/dev/null \
            | python3 -B scripts/perf-children.py 'srt_own::publish' 'srt_own::run' 'TsIngest::drain' \
                read_ts_packet access_unit 'Muxer::push_video' 'Muxer::place_video' 'Muxer::rotate_part' \
                'EsIngest::video' 'LiveStream::render' park_internal \
            > "$out/children.txt"
          head -30 "$out/by-process.txt"
          rm -f "$out/perf.data"
      - name: Retain the text reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: srt-ingest-profile
          path: target/performance-qualification/profile
          if-no-files-found: warn
          retention-days: 7

  ingest-vs-main:
    name: Server CPU and memory against the baseline (SRT ingest, then HTTP)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned compiler, media tools and the SRT publisher
        run: |
          rustup toolchain install --profile minimal
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg srt-tools
      - name: Verify the harness
        run: python3 -B tests/test_compare_srt_ingest.py
      - name: Build the exact baseline and candidate sequentially
        run: bash scripts/build-http-comparison.sh "$QUALIFICATION_BASELINE" "$GITHUB_SHA"
      - name: Paired SRT ingest CPU and peak RSS (12 publishers, 6 Mbit/s each, no viewers)
        run: |
          python3 -B scripts/compare-srt-ingest.py \
            --baseline target/performance-qualification/baseline-sapflow \
            --candidate target/release/sapflow \
            --publishers 12 --bitrate-kbit 6000 --seconds 30 --pairs 4 \
            --output target/performance-qualification/ingest-vs-main.json
      - name: Paired HTTP screening (one stream, 32 viewers; eight streams, 16 each)
        if: always()
        run: |
          python3 -B scripts/compare-http-efficiency.py \
            --baseline target/performance-qualification/baseline-sapflow \
            --candidate target/release/sapflow \
            --bench target/release/sapflow-bench \
            --baseline-source "$QUALIFICATION_BASELINE" --candidate-source "$GITHUB_SHA" \
            --pairs 4 --seconds 30 --threads 4 \
            --output target/performance-qualification/http-vs-main.json
      - name: Retain compact results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: server-vs-main
          path: |
            target/performance-qualification/ingest-vs-main.json
            target/performance-qualification/http-vs-main.json
          if-no-files-found: warn
          retention-days: 7
