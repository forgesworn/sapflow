# Optional TLS/HTTP2 front for the viewer listener only. No live configuration.
# Set SAPFLOW_TLS_BIND (e.g. 127.0.0.1:8443), SAPFLOW_TLS_PEM (certificate chain
# plus private key), SAPFLOW_HLS_UPSTREAM (e.g. 127.0.0.1:8888), then validate:
#   haproxy -c -f docs/examples/haproxy.cfg
global
    maxconn 20000
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 5s
    timeout http-keep-alive 45s

frontend hls_tls
    bind "${SAPFLOW_TLS_BIND}" ssl crt "${SAPFLOW_TLS_PEM}" alpn h2,http/1.1
    acl public_hls path_beg /live-hls/live/
    http-request return status 404 unless public_hls
    http-request replace-path ^/live-hls/(.*)$ /\1
    default_backend sapflow_viewers

backend sapflow_viewers
    # Blocking reloads need one upstream connection per in-flight request.
    # Reuse HTTP/1.1 connections without caching playlists or delaying parts.
    http-reuse always
    server origin "${SAPFLOW_HLS_UPSTREAM}" maxconn 20000
