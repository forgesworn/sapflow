[package]
name = "sapflow-hls"
description = "Low-Latency HLS packaging in pure Rust, plus sans-IO RTMP publish ingest, FLV and MPEG-TS demuxing and fragmented MP4 writing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["hls", "ll-hls", "rtmp", "mpeg-ts", "fmp4"]
categories = ["multimedia::video", "network-programming"]

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
mp4-atom = "0.16.2"
adts-reader = "0.4.0"
h264-reader = "0.9.0"
mpeg2ts = "0.6.1"
tracing = "0.1.44"
# The RTMP digest handshake.
hmac = "0.12.1"
sha2 = "0.10.9"
