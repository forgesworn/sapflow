[package]
name = "sapflow-hls"
description = "Low-Latency HLS packaging in pure Rust: FLV and MPEG-TS ingest, fragmented MP4 parts and segments, and playlists that follow Apple's rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["hls", "ll-hls", "mpeg-ts", "fmp4", "streaming"]
categories = ["multimedia::video", "network-programming"]

[lints]
workspace = true

[dependencies]
sapflow-core = { path = "../sapflow-core", version = "0.1.0" }
bytes = "1.12.1"
mp4-atom = "0.16.2"
adts-reader = "0.4.0"
h264-reader = "0.9.0"
mpeg2ts = "0.6.1"
tracing = "0.1.44"

sha2 = { version = "=0.11.1", default-features = false }
