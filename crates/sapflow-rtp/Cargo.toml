[package]
name = "sapflow-rtp"
description = "RTP and RTCP packets, SRTP and SRTCP for receive-only WHIP ingest, in pure Rust, sans-IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["rtp", "rtcp", "srtp", "webrtc", "sans-io"]
categories = ["network-programming", "multimedia::video"]

[lints]
workspace = true

[dependencies]
aes = { version = "=0.9.3", features = ["zeroize"] }
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha1 = { version = "=0.11.0", features = ["zeroize"] }
subtle = "=2.6.1"
zeroize = "=1.9.1"

[features]
# Test helpers (an RTP builder, SRTP protect for RTP) and the fuzz entry
# points. Not for production use.
testing = []
