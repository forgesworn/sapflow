[package]
name = "sapflow-ffi"
description = "Native Swift and Kotlin boundary for Sapflow broadcasting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[[bin]]
name = "sapflow-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[lints]
workspace = true

[dependencies]
bytes = "=1.12.1"
sapflow-client = { path = "../sapflow-client" }
sapflow-hls = { path = "../sapflow-hls" }
sapflow-srt = { path = "../sapflow-srt" }
uniffi = { version = "=0.32.2", default-features = false }
