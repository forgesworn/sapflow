[package]
name = "sapflow-ffi"
description = "Native Swift and Kotlin boundary for Sapflow broadcasting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []

[lints]
workspace = true

[dependencies]
bytes = "=1.12.1"
sapflow-client = { path = "../sapflow-client" }
sapflow-hls = { path = "../sapflow-hls" }
sapflow-rtmp = { path = "../sapflow-rtmp" }
sapflow-srt = { path = "../sapflow-srt" }
