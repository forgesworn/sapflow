[package]
name = "sapflow"
description = "A small live media server: SRT or RTMP in (H.264, AAC), Low-Latency HLS out, fragmented MP4 recording and a stream-health webhook. Pure Rust, no unsafe."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["media-server", "srt", "rtmp", "hls", "streaming"]
categories = ["multimedia::video", "command-line-utilities"]

[features]
fuzzing = []

[[bin]]
name = "sapflow"
path = "src/main.rs"

[dependencies]
# The own viewer event loop (own_http.rs, http1.rs); http_lite.rs reads the
# control API requests and the callback answers.
mio = { version = "1.2.4", features = ["net", "os-poll"] }
httparse = "1.10.1"
bytes = "1.12.1"
sapflow-core = { path = "../sapflow-core", version = "0.1.0" }
sapflow-hls = { path = "../sapflow-hls", version = "0.1.0" }
sapflow-rtmp = { path = "../sapflow-rtmp", version = "0.1.0" }
sapflow-srt = { path = "../sapflow-srt", version = "0.1.0" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
rustix = { version = "1.1.5", default-features = false, features = ["process", "std", "fs", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zeroize = "=1.9.1"
getrandom = "=0.4.3"

[lints]
workspace = true
