[package]
name = "sapflow-srt"
description = "SRT receiver for live streams, sans-IO: datagrams and time in, datagrams, events and timers out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
aes = { version = "=0.9.3", features = ["zeroize"] }
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha1 = "=0.11.0"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
