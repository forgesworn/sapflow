[package]
name = "sapflow-srt"
description = "SRT (Secure Reliable Transport) for live streams in pure Rust, sans-IO: listener/receiver and caller/sender, optional AES-CTR encryption, no libsrt."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["srt", "streaming", "sans-io", "live", "video"]
categories = ["network-programming", "multimedia::video"]

[lints]
workspace = true

[dependencies]
aes = { version = "=0.9.3", features = ["zeroize"] }
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha1 = "=0.11.0"
zeroize = "=1.9.1"
getrandom = "=0.4.3"
