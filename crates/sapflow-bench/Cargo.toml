[package]
name = "sapflow-bench"
description = "Benchmark tools: simulated LL-HLS viewers (response times, part fan-out) and a lossy UDP proxy for SRT tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "sapflow-bench"
path = "src/main.rs"

[[bin]]
name = "srt-loss-proxy"
path = "src/bin/srt-loss-proxy.rs"

[dependencies]
bytes = "1.12.1"
http-body-util = "0.1.5"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "ring"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
# An in-process TLS and HTTP/2 front for the end-to-end tests (src/front_tests.rs).
hyper = { version = "1.12.0", features = ["server"] }
rcgen = "0.14.10"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[lints]
workspace = true
